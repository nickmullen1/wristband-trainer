body{margin:0;background:#0b1020;color:#f5f7fb;font-family:Arial,sans-serif}*{box-sizing:border-box}.app{max-width:950px;margin:auto;padding:16px}.top,.modes,.stats{display:flex;gap:10px;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.gwlogo{width:68px;height:68px;object-fit:contain;border-radius:50%;flex:0 0 auto}.modes button{flex:1}.card{background:#151d30;border:1px solid #35415d;border-radius:16px;padding:16px;margin-top:15px}button,input{font:inherit}.btn,.opt{min-height:48px;border:1px solid #40506e;background:#1c2740;color:white;border-radius:11px;padding:8px;font-weight:700}.active,.sel{outline:2px solid #4f8cff}.good{background:#174d2b!important;outline:2px solid #22c55e!important}.bad{background:#5b1e27!important;outline:2px solid #ef4444!important}.hidden{display:none!important}.q{text-align:center}.code{font-size:56px;font-weight:900;letter-spacing:.08em}.muted{color:#abb5c8}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hold{grid-template-columns:repeat(3,1fr)}.title{text-align:center;color:#abb5c8;font-size:12px;font-weight:800;margin:14px 0 7px}.zonewrap{display:grid;grid-template-columns:1fr 95px;gap:8px;align-items:end}.zone{height:125px;display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #40506e;border-radius:8px;overflow:hidden}.zone .opt{border-radius:0}.up{text-align:center;margin-bottom:7px}.ext{height:125px;display:flex;align-items:center}.ext button{width:100%}input{width:100%;height:55px;border-radius:11px;border:1px solid #40506e;background:#0d1527;color:white;padding:10px;text-align:center;font-size:19px}.feedback{padding:12px;border-radius:12px;margin-bottom:10px}.feedback.correct{background:#174d2b;outline:3px solid #22c55e}.feedback.wrong{background:#5b1e27;outline:3px solid #ef4444}.stats>div{flex:1;text-align:center;border:1px solid #35415d;border-radius:10px;padding:9px;margin-top:12px}.stats b{display:block;font-size:2 el="Close celebration">×</button></div></div><script>
const $=x=>document.getElementById(x);
const B={"90":["Green Light / 1st Move",["green","greenlight","green light","1st move","first move"]],"91":["Run",["run"]],"92":["Delay Steal",["delay"]],"98":["Red Light",["red","red light"]],"99":["Fake Steal",["fake steal","fake"]],"80":["Drag",["drag","drag bunt"]],"82":["Push",["push","push bunt"]],"83":["Sac",["sac","sac bunt"]],"84":["Safety Squeeze",["safety","squeeze","safety squeeze"]],"85":["Slash",["slash"]],"89":["Fake Bunt",["fake bunt"]],"0":["NA / Nothing",["na","n/a","nothing",""]],"50":["Take",["take"]],"51":["Swing Away",["swing"]]};
const L={"06":["6 Foot Lead",["6 feet","6ft","6 ft","6 ft lead","6 foot lead"]],"09":["9 Foot Lead",["9 feet","9ft","9 ft","9 ft lead","9 foot lead"]],"12":["12 Foot Lead",["12 feet","12ft","12 ft","12 ft lead","12 foot lead"]]};
const M={pitch:{1:"Fastball",2:"Sinker",3:"Slider",4:"Curveball",5:"Change-up / Splitter",6:"Cutter"},location:{1:"In",2:"Middle",3:"Away",4:"Extended",5:"Up"},hold:{0:"Glove Drop Pick Off",1:"Regular",2:"Long"},tempo:{1:"No",2:"Yes"},back:{0:"NA / Nothing",1:"1st",2:"2nd",3:"3rd"}};
let mode="mixed",q,target={},ans={},locked=false,sc=0,tot=0,st=0,best=0,miss=0;
const keys=o=>Object.keys(o),pickKey=o=>keys(o)[Math.floor(Math.random()*keys(o).length)],norm=s=>s.toLowerCase().trim().replace(/\s+/g," ");
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(id,g){$(id).innerHTML="";sh(Object.entries(M[g])).forEach(([v,n])=>{let b=document.createElement("button");b.className="opt";b.dataset.g=g;b.dataset.v=v;b.textContent=n;b.onclick=()=>choose(b);$(id).appendChild(b)})}
document.querySelectorAll(".loc").forEach(b=>b.onclick=()=>choose(b));
let questionStarted=0,questionTimer=null,isPitchQuestion=false;
function updateClock(){const elapsed=(performance.now()-questionStarted)/1000;$("question-time").textContent=elapsed.toFixed(1)+"s";$("question-clock").classList.toggle("slow",isPitchQuestion&&elapsed>=5);$("question-clock").classList.toggle("fast",isPitchQuestion&&locked&&elapsed<5);return elapsed}
function startClock(){clearInterval(questionTimer);questionStarted=performance.now();isPitchQuestion=!$("def").classList.contains("hidden");$("question-clock").classList.remove("fast","slow");$("time-goal").textContent=isPitchQuestion?"Pitch goal: under 5 seconds":"";updateClock();questionTimer=setInterval(updateClock,50)}
function stopClock(){clearInterval(questionTimer);const elapsed=updateClock();$("time-goal").textContent=isPitchQuestion?(elapsed<5?"Under 5-second goal ✓":"Goal: under 5 seconds"):"Answer time"}
function rec(ok){stopClock();tot++;if(ok){sc++;st++;best=Math.max(best,st);if(st%5===0)showCelebration()}else{miss++;st=0}$("score").textContent=sc;$("total").textContent=tot;$("streak").textContent=st;$("best").textContent=best;$("missed").textContent=miss}
function defenseTarget(){return {pitch:pickKey(M.pitch),location:pickKey(M.location),hold:pickKey({1:M.hold[1],2:M.hold[2]}),tempo:pickKey(M.tempo),back:Math.random()<.2?pickKey({1:M.back[1],2:M.back[2],3:M.back[3]}):"0"}}
function newQ(){locked=false;ans={};let t=mode==="mixed"?(Math.random()<.5?"offense":"defense"):mode;$("off").classList.toggle("hidden",t!=="offense");$("def").classList.toggle("hidden",t!=="defense");$("side").innerHTML="<b>"+t.toUpperCase()+"</b>";$("onext").classList.add("hidden");$("dnext").classList.add("hidden");$("dres").classList.add("hidden");$("fb").className="feedback";$("ores").innerHTML="";document.querySelectorAll(".loc").forEach(x=>x.classList.remove("sel","good","bad"));
if(t==="offense"){let roll=Math.random();if(roll<.25){let lc=pickKey(L),bc=pickKey(Object.fromEntries(Object.entries(B).filter(([c])=>c.startsWith("8")))),rc=pickKey(Object.fromEntries(Object.entries(B).filter(([c])=>c.startsWith("9"))));q={combo:true,code:lc+"-"+bc+"-"+rc,l:L[lc],b:B[bc],parts:[L[lc],B[bc],B[rc]]};$("cat").textContent="LEAD + BUNT + RUN";$("msg").textContent="Enter all three parts — order does not matter"}else if(roll<.65){let lc=pickKey(L),bc=pickKey(B);q={combo:true,code:lc+"-"+bc,l:L[lc],b:B[bc]};$("cat").textContent="LEAD + CALL";$("msg").textContent="Enter both parts — order does not matter"}else{let pool={...B,...L},c=pickKey(pool);q={combo:false,code:c,b:pool[c]};$("cat").textContent=L[c]?"LEAD":"OFFENSE";$("msg").textContent="What does this number mean?"}$("code").textContent=q.code;$("answer").value="";$("answer").disabled=false;$("answer").focus()}
else if(Math.random()<.18){let base=Math.random()<.4?"1":"2";q={pickoff:true,combo:true,code:"88-"+base+"-0",parts:[base==="1"?["1st Base",["1st","first","1st base","first base","1"]]:["2nd Base",["2nd","second","2nd base","second base","2"]],["Glove Drop Pick Off",["glove drop","glove drop pick off","glove drop pickoff","pickoff glove drop","pick off glove drop"]]]};$("off").classList.remove("hidden");$("def").classList.add("hidden");$("cat").textContent="PICKOFF";$("code").textContent=q.code;$("msg").textContent="Enter the pickoff type (base optional)";$("answer").value="";$("answer").disabled=false;$("answer").focus()}
else{build("pitch","pitch");build("hold","hold");build("tempo","tempo");build("back","back");target=defenseTarget();$("cat").textContent="PITCHING";$("code").textContent=target.pitch+target.location+target.hold+target.tempo+target.back;$("msg").textContent="Select all five parts"}startClock()}
function answerNorm(s){return norm(s).replace(/[,\u00a0;+\/&-]/g," ").replace(/\band\b/g," ").replace(/(\d)\s*(?:feet|foot|ft)\b/g,"$1 ft").replace(/\s+/g," ").trim()}
function aliases(part){return [...new Set([...part[1],...part[0].split("/")].map(answerNorm))]}
function single(s,a){return a.some(x=>answerNorm(s)===answerNorm(x))}
function multi(s,parts){s=answerNorm(s);function match(rest,remaining){if(!remaining.length)return rest==="";return remaining.some((part,i)=>aliases(part).some(alias=>(alias===""||rest===alias||rest.startsWith(alias+" "))&&match(rest.slice(alias.length).trim(),remaining.filter((_,j)=>j!==i))))}return match(s,parts)}
function gradeO(){if(locked)return;if(!norm($("answer").value)&&!(!q.combo&&q.code==="0"))return;locked=true;let ok=q.pickoff?(single($("answer").value,aliases(q.parts[1]))||multi($("answer").value,q.parts)):q.combo?multi($("answer").value,q.parts||[q.l,q.b]):single($("answer").value,aliases(q.b));rec(ok);$("answer").disabled=true;$("fb").classList.add(ok?"correct":"wrong");$("ores").innerHTML=ok?"✓ CORRECT":"✕ INCORRECT<br><span class='muted'>"+(q.combo?(q.parts||[q.l,q.b]).map(p=>p[0]).join(" · "):"Accepted: "+q.b[1].join(" / "))+"</span>";$("onext").classList.remove("hidden")}
function choose(b){if(locked)return;let g=b.dataset.g;ans[g]=b.dataset.v;document.querySelectorAll('[data-g="'+g+'"]').forEach(x=>x.classList.remove("sel"));b.classList.add("sel");if(Object.keys(ans).length===5)setTimeout(gradeD,100)}
function gradeD(){if(locked)return;locked=true;let ok=true;["pitch","location","hold","tempo","back"].forEach(g=>{let c=document.querySelector('[data-g="'+g+'"][data-v="'+ans[g]+'"]'),r=document.querySelector('[data-g="'+g+'"][data-v="'+target[g]+'"]');if(ans[g]===target[g])c.classList.add("good");else{ok=false;c.classList.add("bad");r.classList.add("good")}});rec(ok);$("dres").innerHTML=ok?"✓ ALL 5 CORRECT":"✕ REVIEW: "+M.pitch[target.pitch]+" · "+M.location[target.location]+" · "+M.hold[target.hold]+" Hold · "+M.tempo[target.tempo]+" Slide Step · "+M.back[target.back]+" Backpick";$("dres").classList.remove("hidden");$("dnext").classList.remove("hidden")}
let celebrationTimer,celebrationFocus;
function closeCelebration(){clearTimeout(celebrationTimer);$("celebration").classList.add("hidden");if(celebrationFocus)celebrationFocus.focus()}
function showCelebration(){const chill=st%10===0;$("celebration").classList.toggle("chill",chill);$("heehaw-image").classList.toggle("hidden",chill);$("good-image").classList.toggle("hidden",!chill);$("celebration-text").textContent=chill?"good.":"HEE HAW!";$("celebration-caption").textContent=st+" IN A ROW!";$("celebration").setAttribute("aria-label",st+" correct in a row");celebrationFocus=document.activeElement;$("celebration").classList.remove("hidden");$("celebration-close").focus();celebrationTimer=setTimeout(closeCelebration,4000)}
$("celebration-close").onclick=closeCelebration;$("celebration").onclick=e=>{if(e.target===$("celebration"))closeCelebration()};
$("submit").onclick=gradeO;document.addEventListener("keydown",e=>{if(!$("celebration").classList.contains("hidden")){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();closeCelebration()}return}if(e.key!=="Enter"||e.repeat)return;if(locked){e.preventDefault();newQ()}else if(!$("off").classList.contains("hidden")&&e.target===$("answer")){e.preventDefault();gradeO()}});$("onext").onclick=newQ;$("dnext").onclick=newQ;document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));newQ()});newQ();
</script></body></html>
